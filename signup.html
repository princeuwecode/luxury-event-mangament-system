<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up Page</title>
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/signup.css" />
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    .error-message {
      color: red;
      font-size: 0.8rem;
      margin-top: 3px;
    }
    input:invalid {
      border-color: red;
    }
  </style>
</head>
<body>
  <header class="header">
    <nav class="navbar">
      <a href="login.html">Home</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>


  <div class="membership-header">
    <h1>Luxury Event Management</h1>
    <div class="underline"></div>
  </div>

  <div class="signup-messages">
    <ul>
      <li><i class='bx bx-star'></i> Experience premium event planning</li>
      <li><i class='bx bx-calendar'></i> Tailored services for every occasion</li>
      <li><i class='bx bx-happy-alt'></i> 1000+ happy clients</li>
      <li><i class='bx bx-shield'></i> Trusted & Secure Booking</li>
    </ul>
  </div>

  <div class="SignUp-Container">
    <h2>Create an Account</h2>
    <form id="signupForm" novalidate>

      <label for="full_name">Full Name:</label>
      <input type="text" id="full_name" required>
      <div id="nameError" class="error-message"></div>


      <label for="phone">Phone No:</label>
      <input type="tel" id="phone" maxlength="10" inputmode="numeric" required>
      <div id="phoneError" class="error-message"></div>


      <label for="email">Email:</label>
      <input type="email" id="email" required>
      <div id="emailError" class="error-message"></div>

      <label for="address">Address:</label>
      <input type="text" id="address" required>

     
      <label for="password">Password:</label>
      <input type="password" id="password" required>


      <label for="age">Age:</label>
      <input type="number" id="age" min="10" max="99" required>

      <label>Gender:</label>
      <div class="gender-group">
        <input type="radio" id="male" name="gender" value="Male" required>
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label>
      </div>

      <button type="submit">Sign Up</button>
    </form>
    <p>Already have an account? <a href="login.html">Login here</a></p>
  </div>

  <script>
    $(document).ready(function () {

      $('#full_name').on('input', function () {
        const name = $(this).val().trim();
        const nameRegex = /^[a-zA-Z\s]{3,}$/;
        if (!nameRegex.test(name)) {
          $('#nameError').text('Name must be at least 3 letters and only contain alphabets.');
        } else {
          $('#nameError').text('');
        }
      });

      
      $('#phone').on('input', function () {
        let digits = $(this).val().replace(/\D/g, '');
        if (digits.length > 10) digits = digits.substring(0, 10);
        $(this).val(digits);
        if (digits.length !== 10) {
          $('#phoneError').text('Phone number must be exactly 10 digits.');
        } else {
          $('#phoneError').text('');
        }
      });

      $('#email').on('input', function () {
        const email = $(this).val().trim();
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(email)) {
          $('#emailError').text('Please enter a valid email address.');
        } else {
          $('#emailError').text('');
        }
      });

      $('#signupForm').submit(function (e) {
        e.preventDefault();

        const fullName = $('#full_name').val().trim();
        const phone = $('#phone').val().trim();
        const email = $('#email').val().trim();
        const address = $('#address').val().trim();
        const password = $('#password').val().trim();
        const age = parseInt($('#age').val());
        const gender = $("input[name='gender']:checked").val();

        const nameValid = /^[a-zA-Z\s]{3,}$/.test(fullName);
        const phoneValid = /^\d{10}$/.test(phone);
        const emailValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);

        if (!nameValid || !phoneValid || !emailValid || !address || !password || isNaN(age) || !gender) {
          alert("Please fix the highlighted errors before submitting.");
          return;
        }

        const userData = {
          full_name: fullName,
          phone: phone,
          email: email,
          address: address,
          password: password,
          age: age,
          gender: gender
        };

        $.ajax({
          url: 'http://127.0.0.1:8000/signup',
          method: 'POST',
          contentType: 'application/json',
          data: JSON.stringify(userData),
          success: function () {
            alert('Signup successful!');
            window.location.href = '/login.html';
          },
          error: function (xhr) {
            alert('Signup failed: ' + (xhr.responseJSON?.detail || 'Unknown error'));
          }
        });
      });
    });
  </script>
  <script src="/global-chatbot.js"></script>
</body>
</html>
