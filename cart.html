<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Cart - Luxury Event Management</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(to right, #f8f9fa, #dee2e6);
    }

    .container {
      max-width: 900px;
      margin: 50px auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 30px;
    }

    ul#cart-items {
      list-style: none;
      padding: 0;
    }

    ul#cart-items li {
      background: #f1f1f1;
      padding: 15px 20px;
      margin-bottom: 10px;
      border-left: 6px solid #007bff;
      font-size: 18px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    ul#cart-items li div {
      line-height: 1.3;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 30px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 12px 25px;
      background-color: #28a745;
      color: white;
      font-size: 16px;
      text-decoration: none;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .btn:hover {
      background-color: #218838;
    }

    .btn-back {
      background-color: #007bff;
    }

    .btn-back:hover {
      background-color: #0056b3;
    }

    .empty {
      text-align: center;
      font-size: 20px;
      color: #777;
      margin-top: 20px;
    }

    .remove-btn {
      background: none;
      border: none;
      color: red;
      cursor: pointer;
      font-size: 16px;
      padding: 5px 10px;
      border-radius: 5px;
      transition: background-color 0.2s;
    }

    .remove-btn:hover {
      background-color: #ffdddd;
      text-decoration: underline;
    }

    #total-amount {
      font-weight: bold;
      font-size: 20px;
      margin-top: 20px;
      text-align: right;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Your Cart</h1>
    <ul id="cart-items"></ul>

    <div id="total-amount" style="display:none;"></div>

    <div class="empty" id="empty-message" style="display: none;">Your cart is empty.</div>

    <div class="actions" id="actions" style="display: none;">
      <a href="/card.html" class="btn btn-back">Back to Services</a>
      <button class="btn" onclick="finalizeOrder()">Finalize Order</button>
    </div>
  </div>

  <script>
    function renderCart() {
      const cart = JSON.parse(localStorage.getItem("cart")) || [];
      const cartItemsContainer = document.getElementById("cart-items");
      const emptyMessage = document.getElementById("empty-message");
      const actions = document.getElementById("actions");
      const totalAmountDiv = document.getElementById("total-amount");

      cartItemsContainer.innerHTML = "";
      totalAmountDiv.style.display = "none";
      totalAmountDiv.textContent = "";

      if (cart.length === 0) {
        emptyMessage.style.display = "block";
        actions.style.display = "none";
        return;
      }

      emptyMessage.style.display = "none";
      actions.style.display = "flex";

      let grandTotal = 0;

      cart.forEach((item, index) => {
        const li = document.createElement("li");

        const quantity = item.quantity || 1;
        let total = item.total;
        if (!total) {
          total = quantity * (item.pricePerPlate || 0);
        }

        grandTotal += total;

        li.innerHTML = `
          <div>
            <strong>${item.item}</strong><br>
            Quantity: ${quantity}<br>
            Total: ₹${total}
          </div>
        `;

        const removeBtn = document.createElement("button");
        removeBtn.textContent = "Remove";
        removeBtn.className = "remove-btn";
        removeBtn.onclick = () => removeItem(index);

        li.appendChild(removeBtn);
        cartItemsContainer.appendChild(li);
      });

      totalAmountDiv.style.display = "block";
      totalAmountDiv.textContent = `Grand Total: ₹${grandTotal}`;
    }

    function removeItem(index) {
      let cart = JSON.parse(localStorage.getItem("cart")) || [];
      cart.splice(index, 1);
      localStorage.setItem("cart", JSON.stringify(cart));
      renderCart();
    }

    function finalizeOrder() {
      const cart = JSON.parse(localStorage.getItem("cart")) || [];
      if (cart.length === 0) {
        alert("Your cart is empty!");
        return;
      }

      let orderSummary = "Thank you for finalizing your order:\n\n";
      cart.forEach(item => {
        const quantity = item.quantity || 1;
        const total = item.total || (quantity * (item.pricePerPlate || 0));
        orderSummary += `${item.item} - Quantity: ${quantity} - Total: ₹${total}\n`;
      });

      orderSummary += `\nGrand Total: ₹${cart.reduce((acc, item) => acc + (item.total || (item.quantity * (item.pricePerPlate || 0))), 0)}`;

      alert(orderSummary);
      localStorage.removeItem("cart");
      renderCart();
    }
    function finalizeOrder() {
  const cart = JSON.parse(localStorage.getItem("cart")) || [];
  if (cart.length === 0) {
    alert("Your cart is empty!");
    return;
  }
  window.location.href = "/final_order.html";
}


    window.onload = renderCart;
  </script>
  <script src="/global-chatbot.js"></script>
</body>
</html>
