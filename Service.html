<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <title>Menu Bar</title>
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="/static/Service.css">
</head>
<body>

<input type="checkbox" id="check">

<label for="check">
    <i class="fas fa-bars" id="btn"></i>
    <i class="fas fa-times" id="cancel"></i>
</label>

<div class="sidebar">
    <header>Menu</header>
    <ul>
        <li><a href="#"><i class="fas fa-qrcode"></i>Dashboard</a></li>
        <li><a href="#"><i class="fas fa-clipboard-list"></i>Overview</a></li>
        
        <li class="has-submenu">
            <a href="#" onclick="toggleSubMenu(event)">
                <i class="fas fa-glass-cheers"></i>Events ▸
            </a>
            <ul class="submenu" id="eventSubmenu">
                <li><a href="#">Wedding Party</a></li>
                <li><a href="#">Birthday Party</a></li>
                <li><a href="#">Corporate Party</a></li>
                <li><a href="#">Other Party</a></li>
            </ul>
        </li>

        <li><a href="/about.html"><i class="fas fa-utensils"></i>Caterers</a></li>
        <li><a href="#"><i class="fas fa-volume-up"></i>Sound Systems</a></li>
        <li><a href="/contact.html"><i class="fas fa-history"></i>Previous</a></li>
        <li><a href="/login.html"><i class="fas fa-home"></i>Home</a></li>
    </ul>
</div>

<section></section>

<script>
    function toggleSubMenu(event) {
        event.preventDefault();
        const submenu = document.getElementById('eventSubmenu');
        submenu.style.display = submenu.style.display === 'block' ? 'none' : 'block';
    }

    document.addEventListener('click', function (e) {
        const submenu = document.getElementById('eventSubmenu');
        if (!e.target.closest('.has-submenu')) {
            submenu.style.display = 'none';
        }
    });


</script>
<script src="/global-chatbot.js"></script>
</body>
</html>
