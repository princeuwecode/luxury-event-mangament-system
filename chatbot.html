<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxury Event Assistant</title>
    <link rel="stylesheet" href="/chatbot.css">
</head>
<body>

    <div class="chat-wrapper">
        <div class="chat-header">
            <div>
                <h2>Luxury Event Management Assistant</h2>
                <p>Your  Event Guide</p>
            </div>
            <button onclick="goBack()">✖</button>
        </div>

        <div class="quick-questions">
            <button onclick="quickAsk('What services do you provide?')">Services</button>
            <button onclick="quickAsk('Tell me about wedding packages')">Wedding</button>
            <button onclick="quickAsk('Tell me about birthday events')">Birthday</button>
            <button onclick="quickAsk('Show menu details')">Menu</button>
            <button onclick="quickAsk('What are your prices?')">Pricing</button>
            <button onclick="quickAsk('How can I book an event?')">Booking</button>
            <button onclick="quickAsk('Do you provide decoration themes?')">Themes</button>
            <button onclick="quickAsk('How can I contact you?')">about</button>
            <button onclick="quickAsk('How can I contact you?')">Contact</button>
        </div>

        <div class="chat-box" id="chatBox">
            <div class="bot-message">
                Welcome to <strong>Luxury Event Management</strong> ✨<br><br>
                I am your  event assistant.<br>
                Ask me about our services, packages, booking, menu, themes, and more.
            </div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Ask your luxury event question..." />
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        function goBack() {
    window.history.back();
}

function quickAsk(question) {
    document.getElementById("userInput").value = question;
    sendMessage();
}

async function sendMessage(){


       async function sendMessage() {
const input = document.getElementById("userInput");
const chatBox = document.getElementById("chatBox");

const userText = input.value.trim();
if (userText === "") return;

const userMsg = document.createElement("div");
userMsg.className = "user-message";
userMsg.textContent = userText;
chatBox.appendChild(userMsg);

input.value = "";

const botMsg = document.createElement("div");
botMsg.className = "bot-message";
chatBox.appendChild(botMsg);

const text = userText.toLowerCase();

if (text.includes("service")) {
    botMsg.innerHTML = "We provide Wedding Events, Birthday Parties, Corporate Events, Catering Services, Decoration Services and Luxury Event Planning.";
}
else if (text.includes("wedding")) {
    botMsg.innerHTML = "Our wedding package includes venue decoration, catering, photography, entertainment and complete event management.";
}
else if (text.includes("birthday")) {
    botMsg.innerHTML = "We organize birthday parties with custom themes, decoration, cake arrangements and catering services.";
}
else if (text.includes("menu")) {
    botMsg.innerHTML = "Our menu includes Veg and Non-Veg starters, beverages, main course dishes and desserts.";
}
else if (text.includes("price") || text.includes("pricing")) {
    botMsg.innerHTML = "Prices depend on event type, guest count and selected services. Please contact us for a custom quotation.";
}
else if (text.includes("book") || text.includes("booking")) {
    botMsg.innerHTML = "You can book an event by contacting us through the Contact page or by filling out the booking form.";
}
else if (text.includes("theme") || text.includes("decoration")) {
    botMsg.innerHTML = "Yes, we provide luxury decoration themes for weddings, birthdays, corporate events and special occasions.";
}
else if (text.includes("contact") || text.includes("about")) {
    botMsg.innerHTML = "You can find our contact details on the Contact page. We are available by phone and email.";
}
else {
    botMsg.innerHTML = "Thank you for your question. Please explore our Services, Menu, Contact and About pages for more information.";
}

chatBox.scrollTop = chatBox.scrollHeight;


}
}
    </script>
    
</body>
</html>
